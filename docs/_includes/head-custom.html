<!-- The theme prints mermaid fences as code; github.com draws them itself, so the source keeps plain fences. -->
<style>
  .mermaid-diagram { margin: 16px 0; overflow-x: auto; text-align: center; }
  .status { display: inline-block; font-size: 85%; font-weight: 600; padding: 0 6px; border-radius: 3px; }
  .status.built { background: #dafbe1; color: #1a7f37; }
  .status.proposed { background: #fff8c5; color: #9a6700; }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
  if (blocks.length > 0) {
    blocks.forEach((block) => {
      const holder = block.matches("div") ? block : block.parentElement;
      const diagram = document.createElement("pre");
      diagram.className = "mermaid mermaid-diagram";
      diagram.textContent = holder.textContent;
      holder.replaceWith(diagram);
    });
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", deterministicIds: true });
    await mermaid.run({ querySelector: "pre.mermaid" });
  }
</script>
